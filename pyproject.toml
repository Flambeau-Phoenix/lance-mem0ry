[project]
name = "lance-memory"
version = "1.1.0"
description = "Mem0-inspired persistent memory for AI agents, backed by LanceDB."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
    "lancedb>=0.13.0",
    "pyarrow>=15.0.0",
    "openai>=1.40.0",
    "pydantic>=2.6.0",
    "mcp>=1.0.0",
    "fastmcp>=0.4.0",
    "numpy>=1.26.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
local  = ["fastembed>=0.3.0"]
rerank = ["cohere>=5.0.0", "sentence-transformers>=3.0.0"]
redis  = ["redis>=5.0.0"]
dev    = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.5.0"]

[project.scripts]
lance-memory-mcp = "lance_memory.mcp_server:main"
lance-memory     = "lance_memory.cli:main"
lance-memory-api = "lance_memory.api:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lance_memory"]

[tool.hatch.build.targets.sdist]
include = [
    "src/lance_memory",
    "tests",
    "scripts",
    "README.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
