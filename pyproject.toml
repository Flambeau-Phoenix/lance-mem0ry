[project]
name = "lance-memory"
version = "1.1.0"
description = "Mem0-inspired persistent memory for AI agents, backed by LanceDB."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "LanceMemory Contributors" }]
keywords = ["mcp", "memory", "ai-agents", "lancedb", "ollama", "claude-code", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "lancedb>=0.13.0",
    "pyarrow>=15.0.0",
    "openai>=1.40.0",
    "pydantic>=2.6.0",
    "mcp>=1.0.0",
    "fastmcp>=0.4.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
admin  = ["streamlit>=1.30.0"]
local  = ["fastembed>=0.3.0"]
rerank = ["cohere>=5.0.0", "sentence-transformers>=3.0.0"]
redis  = ["redis>=5.0.0"]
dev    = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.5.0"]

[project.urls]
Homepage = "https://github.com/Flambeau-Phoenix/lance-mem0ry"
Issues = "https://github.com/Flambeau-Phoenix/lance-mem0ry/issues"
Changelog = "https://github.com/Flambeau-Phoenix/lance-mem0ry/blob/master/CHANGELOG.md"

[project.scripts]
lance-memory-mcp = "lance_memory.mcp_server:main"
lance-memory     = "lance_memory.cli:main"
lance-memory-api = "lance_memory.api:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src/lance_memory is auto-discovered by hatchling for wheels/editable installs.
[tool.hatch.build.targets.wheel]
packages = ["src/lance_memory"]

[tool.hatch.build.targets.sdist]
include = [
    "src/lance_memory",
    "tests",
    "server",
    "examples",
    "docs",
    "templates",
    "systemd",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    ".env.example",
]

[tool.ruff]
line-length = 100
target-version = "py310"